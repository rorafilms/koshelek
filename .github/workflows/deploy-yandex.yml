# При каждом обновлении на GitHub выкладывает сайт в Yandex Object Storage
# Адрес: https://koshelek.website.yandexcloud.net
name: Публикация в Yandex Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-yandex
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/check.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка ключей
        env:
          KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
        run: |
          if [ -z "$KEY_ID" ]; then
            echo "::error::Нет секретов YC_ACCESS_KEY_ID / YC_SECRET_ACCESS_KEY в настройках репозитория"
            exit 1
          fi

      - name: Загрузка в хранилище
        env:
          KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          KEY_SECRET: ${{ secrets.YC_SECRET_ACCESS_KEY }}
        run: |
          set -e
          up() { # файл, тип, кэш
            code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" --aws-sigv4 "aws:amz:ru-central1:s3" \
              --user "$(echo -n "$KEY_ID" | tr -d '[:space:]'):$(echo -n "$KEY_SECRET" | tr -d '[:space:]')" \
              -H "Content-Type: $2" -H "Cache-Control: $3" -T "$1" \
              "https://storage.yandexcloud.net/koshelek/$1")
            if [ "$code" != "200" ]; then echo "::error::$1 → HTTP $code"; cat /tmp/resp.txt; exit 1; fi
            echo "✓ $1"
          }
          for f in *.png; do up "$f" "image/png" "public,max-age=604800"; done
          up manifest.webmanifest "application/manifest+json" "no-cache"
          up index.html "text/html; charset=utf-8" "no-cache"
          up sw.js "text/javascript; charset=utf-8" "no-cache"
          echo "Готово: https://koshelek.website.yandexcloud.net"
